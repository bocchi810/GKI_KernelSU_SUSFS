name: Setup Official KernelSU
description: Download and configure official KernelSU (tiann/KernelSU) with version tracking
inputs:
  use_latest_commits:
    description: 'Use the latest main branch commit instead of a pinned tag'
    required: false
    default: true

runs:
  using: composite
  steps:
    - name: Download Official KernelSU
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        if [ "${{ inputs.use_latest_commits }}" = "true" ]; then
          echo "Using latest official KernelSU (main branch)"
          # Pass 'main' so setup.sh stays on main branch instead of checking out the latest tag
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        else
          COMMITS_JSON="${{ github.workspace }}/.github/config/commits.json"
          KSU_TAG=$(jq -er '.kernelsu.tag // empty' "$COMMITS_JSON")
          if [ -n "$KSU_TAG" ]; then
            echo "Using pinned KernelSU tag: $KSU_TAG"
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "$KSU_TAG"
          else
            echo "No pinned tag found, using latest official KernelSU"
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          fi
        fi

    - name: Extract KSU Version Info
      id: ksu-version
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU
      run: |
        set -euo pipefail
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "no-tag")
        KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV
        echo "KSU_COMMIT=$KSU_COMMIT" >> $GITHUB_ENV
        echo "KSU_VERSION=$KSU_GIT_TAG" >> $GITHUB_ENV
        echo "KSU_BRANCH=main" >> $GITHUB_ENV

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        fragment: ${{ github.workspace }}/wild_gki.fragment
        configs: |
          CONFIG_KSU